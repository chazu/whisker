# Whisker configuration.
#
# Copy to ~/.config/whisker/config.toml and edit. Without this file Whisker
# uses exactly these defaults. Point WHISKER_CONFIG at another path to override
# the location.

# The Alt-O cycle, in order. The last view wraps back to the first.
views = ["dev", "ops", "minimal"]

# The view each new shell starts in. Defaults to the first view above.
start = "dev"

[view.minimal]
segments = ["directory"]

[view.dev]
label = "[dev] "
segments = ["directory", "git"]

[view.ops]
label = "[ops] "
segments = ["directory", "kubernetes"]

# Views can also be arranged on a 2D grid and moved through with
# `whisker view move --direction left|right|up|down --current NAME`, which is a
# way of navigating the views that already exist rather than a second kind of
# thing. Movement does not wrap, and cells no view claims are skipped.
#
# [grid]
# rows = ["code", "infra"]
# columns = ["dev", "ops"]
# state = "/run/user/1000/whisker-nodes"   # where node status is read from
#
# [view.ops]
# at = ["infra", "ops"]     # this view's place on the grid
# alert = { command = ["check-ops"], when = "exit" }
#
# `whisker collect` runs each view's alert command and writes the state file.
# when = "exit" alerts on a non-zero exit; when = "output" alerts when the
# command prints anything. Run it from cron or a background loop, never from
# the prompt: the checks are the slow part.
#
# The state file is one line per view, "NAME STATUS [anything else]", with
# STATUS being ok, alert, or unknown. Something else writes it on its own
# schedule, because collecting each node's status inline would slow every
# prompt. Anything unreadable or malformed leaves that node unknown.
#
# Segments only need a [segment.name] entry to customise them, or to define a
# new one. Built-in sources: directory, git, kubernetes, grid.
#
# The grid segment draws the view grid as a small inline image, one dot per
# node, coloured by state, white for where you are. It needs a terminal that
# supports the kitty graphics protocol and reports its cell size; without both
# it simply disappears, like any other segment with nothing to say.
#
# [segment.grid]
# dot = 4    # points per node; 4 or 5 read best, useful range 3 to 6
# gap = 1    # points between nodes
#
# On a scaled display set WHISKER_SCALE=2 so the art is built at twice the
# size, since the terminal scales the image into a box measured in points.
#
# [segment.directory]
# keep_end = true    # shorten as …/deep/tail rather than head…
# shrink = true      # may be shortened to fit the terminal width
# style = { fg = "blue", bold = true }
#
# Some values are only true when they are complete. A status marker clipped
# halfway still looks like a status marker while hiding whatever fell off the
# end, which is worse than showing nothing at all. Such a segment can refuse to
# be shortened, and offer something briefer in its place:
#
# [segment.status]
# command = ["my-status", "--full"]
# atomic = true                       # show it whole or not at all
# fallback = ["my-status", "--brief"] # what to show instead when it will not fit
#
# Styling is structured configuration, applied after the row is laid out, so
# colour never affects the measured width. fg and bg take a colour name
# (red, bright_red), a 0-255 palette index, or #rrggbb. The attributes are
# bold, dim, italic, and underline. A view can set a style for all its
# segments, plus label_style and separator_style:
#
# [view.dev]
# style = { dim = true }
# label_style = { fg = "green", bold = true }
# separator_style = { fg = "bright_black" }
#
# A custom segment runs a local program directly, with no shell involved. Its
# first output line is used; a failure or missing program hides the segment.
#
# [segment.aws]
# command = ["aws", "configure", "get", "region"]
# prefix = "aws:"           # prefix and suffix wrap the value, and survive
# suffix = ""               # shortening, so an icon is never eaten first
# style = { fg = "yellow" }
#
# [view.cloud]
# label = "[cloud] "
# separator = "  "
# segments = ["directory", "aws"]
