# Whisker configuration.
#
# Copy to ~/.config/whisker/config.toml and edit. Without this file Whisker
# uses exactly these defaults. Point WHISKER_CONFIG at another path to override
# the location.

# The Alt-O cycle, in order. The last view wraps back to the first.
views = ["dev", "ops", "minimal"]

# The view each new shell starts in. Defaults to the first view above.
start = "dev"

[view.minimal]
segments = ["directory"]

[view.dev]
label = "[dev] "
segments = ["directory", "git"]

[view.ops]
label = "[ops] "
segments = ["directory", "kubernetes"]

# Segments only need a [segment.name] entry to customise them, or to define a
# new one. Built-in sources: directory, git, kubernetes.
#
# [segment.directory]
# keep_end = true    # shorten as …/deep/tail rather than head…
# shrink = true      # may be shortened to fit the terminal width
# style = { fg = "blue", bold = true }
#
# Styling is structured configuration, applied after the row is laid out, so
# colour never affects the measured width. fg and bg take a colour name
# (red, bright_red), a 0-255 palette index, or #rrggbb. The attributes are
# bold, dim, italic, and underline. A view can set a style for all its
# segments, plus label_style and separator_style:
#
# [view.dev]
# style = { dim = true }
# label_style = { fg = "green", bold = true }
# separator_style = { fg = "bright_black" }
#
# A custom segment runs a local program directly, with no shell involved. Its
# first output line is used; a failure or missing program hides the segment.
#
# [segment.aws]
# command = ["aws", "configure", "get", "region"]
# prefix = "aws:"           # prefix and suffix wrap the value, and survive
# suffix = ""               # shortening, so an icon is never eaten first
# style = { fg = "yellow" }
#
# [view.cloud]
# label = "[cloud] "
# separator = "  "
# segments = ["directory", "aws"]
